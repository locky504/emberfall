<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERFALL — Hold the Light</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05060f;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Trebuchet MS", Verdana, sans-serif;
  }
  #wrap {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    background: #0b0d1a;
  }
</style>
</head>
<body>
  <div id="wrap"><canvas id="game"></canvas></div>
  <script type="module">
    import { boot } from './src/main.js';
    boot(document.getElementById('game'));
  </script>
</body>
</html>
